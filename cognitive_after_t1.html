        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#FFA500", "id": "C_1_1", "label": "\u6765\u6708\u306e\u5927\u5207\u306a\u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u767a\u8868\u306b\u5411\u3051\u3066\n\u6d3b\u6027\u5ea6: 0.05 \u2192 0.05 (+0.00)", "shape": "ellipse", "title": "\u003cb\u003e\u6765\u6708\u306e\u5927\u5207\u306a\u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u767a\u8868\u306b\u5411\u3051\u3066\u003c/b\u003e\u003cbr\u003e\u4ecb\u5165\u524d\u6d3b\u6027\u5ea6: 0.050\u003cbr\u003e\u4ecb\u5165\u5f8c\u6d3b\u6027\u5ea6: 0.050\u003cbr\u003e\u5dee\u5206 \u0394c: +0.000"}, {"color": "#FFA500", "id": "C_1_2", "label": "\u69cb\u6210\u6848\u306e\u53e9\u304d\u53f0\u3092\u4f5c\u308b\n\u6d3b\u6027\u5ea6: 0.05 \u2192 0.05 (+0.00)", "shape": "ellipse", "title": "\u003cb\u003e\u69cb\u6210\u6848\u306e\u53e9\u304d\u53f0\u3092\u4f5c\u308b\u003c/b\u003e\u003cbr\u003e\u4ecb\u5165\u524d\u6d3b\u6027\u5ea6: 0.050\u003cbr\u003e\u4ecb\u5165\u5f8c\u6d3b\u6027\u5ea6: 0.050\u003cbr\u003e\u5dee\u5206 \u0394c: +0.000"}, {"color": "#FFA500", "id": "C_1_3", "label": "\u30c1\u30fc\u30e0\u306b\u8ca2\u732e\u3067\u304d\u308b\n\u6d3b\u6027\u5ea6: 0.05 \u2192 0.05 (+0.00)", "shape": "ellipse", "title": "\u003cb\u003e\u30c1\u30fc\u30e0\u306b\u8ca2\u732e\u3067\u304d\u308b\u003c/b\u003e\u003cbr\u003e\u4ecb\u5165\u524d\u6d3b\u6027\u5ea6: 0.050\u003cbr\u003e\u4ecb\u5165\u5f8c\u6d3b\u6027\u5ea6: 0.050\u003cbr\u003e\u5dee\u5206 \u0394c: +0.000"}, {"color": "#FFA500", "id": "C_1_4", "label": "\u30c1\u30fc\u30e0\u306b\u8ca2\u732e\u3067\u304d\u308b\u7d76\u597d\u306e\u6a5f\u4f1a\u3060\u3068\u601d\u3063\u3066\n\u6d3b\u6027\u5ea6: 0.05 \u2192 0.05 (+0.00)", "shape": "ellipse", "title": "\u003cb\u003e\u30c1\u30fc\u30e0\u306b\u8ca2\u732e\u3067\u304d\u308b\u7d76\u597d\u306e\u6a5f\u4f1a\u3060\u3068\u601d\u3063\u3066\u003c/b\u003e\u003cbr\u003e\u4ecb\u5165\u524d\u6d3b\u6027\u5ea6: 0.050\u003cbr\u003e\u4ecb\u5165\u5f8c\u6d3b\u6027\u5ea6: 0.050\u003cbr\u003e\u5dee\u5206 \u0394c: +0.000"}]);
                  edges = new vis.DataSet([]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "barnesHut": {
            "avoidOverlap": 0,
            "centralGravity": 0.35,
            "damping": 0.09,
            "gravitationalConstant": -2800,
            "springConstant": 0.001,
            "springLength": 150
        },
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
